name: Summarize Websites

on:
  schedule:
    # هر روز ساعت ۰۹:۳۰ به وقت تهران (۰۶:۰۰ UTC)
    - cron: "0 6 * * *"
  push:
    branches: [main]
    paths:
      - "config/sites.json"
  workflow_dispatch:
    inputs:
      force:
        description: "بازتولید همه خلاصه‌ها حتی کش‌شده"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync sites from Cloudflare Worker
        env:
          WORKER_API: ${{ secrets.WORKER_API }}
          ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
        run: |
          python - <<'EOF'
          import json, os, urllib.request, sys
          base = os.environ["WORKER_API"].rstrip("/")
          if not base.endswith("/api"): base += "/api"
          tok = os.environ["ADMIN_TOKEN"]
          url = base + "/admin/list"
          print("syncing from", url, flush=True)
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + tok, "User-Agent": "site-summarizer-ci"})
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          try:
              with opener.open(req, timeout=30) as r:
                  body = r.read().decode("utf-8")
          except Exception as e:
              print("::error::sync request failed:", e); sys.exit(1)
          d = json.loads(body)
          if "error" in d or "sites" not in d:
              print("::error::sync auth failed:", body[:200]); sys.exit(1)
          cfg = [{"id": s["id"], "name": s["name"], "url": s["url"],
                  "category": s.get("category","عمومی"), "tags": s.get("tags",[])}
                 for s in d.get("sites", [])]
          json.dump(cfg, open("config/sites.json","w",encoding="utf-8"), ensure_ascii=False, indent=2)
          print("synced", len(cfg), "sites from Worker")
          EOF

      - name: Run AI summarizer
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python scripts/summarize.py --force
          else
            python scripts/summarize.py
          fi

      - name: Push summaries to Cloudflare Worker
        env:
          WORKER_API: ${{ secrets.WORKER_API }}
          ADMIN_TOKEN: ${{ secrets.WORKER_ADMIN_TOKEN }}
        run: |
          python -c "
          import json, os, urllib.request
          data = json.load(open('data/sites.json'))
          api = os.environ['WORKER_API'].rstrip('/')
          if not api.endswith('/api'): api += '/api'
          tok = os.environ['ADMIN_TOKEN']
          ok, fail = 0, 0
          for s in data.get('sites', []):
              payload = json.dumps({
                  'id': s.get('id'), 'url': s.get('url'), 'name': s.get('name'),
                  'category': s.get('category','عمومی'), 'tags': s.get('tags',[]),
                  'summary': s.get('summary',''), 'highlights': s.get('highlights',[]),
                  'sentiment': s.get('sentiment','اطلاع‌رسانی'),
                  'key_topics': s.get('key_topics',[]),
                  'read_time': s.get('read_time','۳ دقیقه'),
                  'provider': s.get('provider','g4f'),
                  'stale': bool(s.get('stale', False)),
              }, ensure_ascii=False).encode()
              req = urllib.request.Request(
                  api + '/sites/' + urllib.parse.quote(str(s.get('id'))),
                  data=payload, method='PUT',
                  headers={'Content-Type':'application/json', 'Authorization':'Bearer '+tok})
              try:
                  urllib.request.urlopen(req, timeout=30)
                  ok += 1
              except Exception as e:
                  # اگر آپدیت نشد، بساز
                  req2 = urllib.request.Request(
                      api + '/sites', data=payload, method='POST',
                      headers={'Content-Type':'application/json', 'Authorization':'Bearer '+tok})
                  try:
                      urllib.request.urlopen(req2, timeout=30)
                      ok += 1
                  except Exception as e2:
                      fail += 1
                      print('FAIL:', s.get('url'), e2)
          print(f'pushed {ok} ok, {fail} fail')
          "

      - name: Commit config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/sites.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync sites from Worker $(date -u +%Y-%m-%d)"
            git push
          fi
