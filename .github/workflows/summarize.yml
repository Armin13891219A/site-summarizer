name: Summarize Websites

on:
  schedule:
    # هر روز ساعت ۰۹:۳۰ به وقت تهران (۰۶:۰۰ UTC)
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "بازتولید همه خلاصه‌ها حتی کش‌شده"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      add_url:
        description: "آدرس سایت جدید برای افزودن (خالی = پردازش همه)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "config/sites.json"
      - "config/settings.json"
      - "scripts/summarize.py"

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run AI summarizer
        env:
          AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "${{ inputs.add_url }}" ]; then
            python scripts/summarize.py --add "${{ inputs.add_url }}"
          elif [ "${{ inputs.force }}" = "true" ]; then
            python scripts/summarize.py --force
          else
            python scripts/summarize.py
          fi

      - name: Commit updated summaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/sites.json config/sites.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-update website summaries $(date -u +%Y-%m-%d)"
            git push
          fi
